name: Tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - 'tests/**'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'phpstan.neon.dist'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.4', '8.5']
        stability: [prefer-lowest, prefer-stable]

    name: P${{ matrix.php }} - ${{ matrix.stability }} - ${{ matrix.os }}

    env:
      # Coverage, the 100 % threshold and the style check run once, in one cell; the others run the tests.
      FULL_CHECK: ${{ matrix.os == 'ubuntu-latest' && matrix.php == '8.4' && matrix.stability == 'prefer-stable' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, zlib, json, curl, dom
          coverage: ${{ matrix.os == 'ubuntu-latest' && matrix.php == '8.4' && matrix.stability == 'prefer-stable' && 'pcov' || 'none' }}

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests with the coverage threshold
        if: env.FULL_CHECK == 'true'
        # Merging the coverage of the whole suite needs more than the default 128 MB.
        run: php -d memory_limit=1G vendor/bin/pest --ci --fail-on-warning --fail-on-risky --fail-on-deprecation --coverage --min=100

      - name: Execute tests
        if: env.FULL_CHECK != 'true'
        run: vendor/bin/pest --ci --fail-on-warning --fail-on-risky --fail-on-deprecation

      - name: Code style
        if: env.FULL_CHECK == 'true'
        run: composer lint

      - name: Static analysis
        run: composer phpstan
